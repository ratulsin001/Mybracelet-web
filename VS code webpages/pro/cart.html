<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - MyBracelet</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">MyBracelet</div>
    <nav>
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/pro/product.html">Products</a></li>
        <li><a href="/pro/cart.html">🛒 Cart (<span id="cart-count">0</span>)</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Cart Section -->
  <section class="cart-container">
    <h1>Your Shopping Cart</h1>
    <table id="cartTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <!-- Cart items will be injected by JS -->
      </tbody>
    </table>
    <h2>Your Cart</h2>
<ul id="cartItems"></ul>
<div class="cart-footer">
  <h3>Total: ₹<span id="cartTotal">0</span></h3>
  <button onclick="proceedToCheckout()" class="checkout-btn" src="checkout.html">Proceed to Checkout</button>
</div>

  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 MyBracelet | All Rights Reserved</p>
  </footer>
  <script src="cart.js"></script></script>
  <script src="/script.js"></script>
</body>
</html>
